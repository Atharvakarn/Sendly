name: Build Sendly 1.0.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sendly-v1.0.0-source.zip'
      - '.github/workflows/build-sendly.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Sendly source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q Sendly-v1.0.0-source.zip -d build-src
          test -f build-src/Sendly/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            build-src/Sendly/**/*.gradle*
            build-src/Sendly/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build installable Sendly APK
        working-directory: build-src/Sendly
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Prepare Sendly 1.0.0 APK
        run: |
          cp build-src/Sendly/app/build/outputs/apk/debug/app-debug.apk Sendly-v1.0.0.apk
          sha256sum Sendly-v1.0.0.apk > Sendly-v1.0.0.sha256

      - name: Upload Sendly 1.0.0
        uses: actions/upload-artifact@v7
        with:
          name: Sendly-v1.0.0
          path: |
            Sendly-v1.0.0.apk
            Sendly-v1.0.0.sha256
          if-no-files-found: error
          retention-days: 30
